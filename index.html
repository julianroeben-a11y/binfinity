<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Binfinity – free, open-source generator for Gridfinity baseplates, bins and custom storage boxes. Runs in your browser, exports STL and 3MF." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Binfinity</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Binfinity">
        <img src="./favicon.svg" alt="" width="28" height="28" />
        <span class="brand-name">Binfinity</span>
      </a>
      <nav id="areas" class="areas" aria-label="Bereich"></nav>
      <div class="topbar-right">
        <a id="version" class="version" target="_blank" rel="noopener"></a>
        <button type="button" id="update" class="small" hidden></button>
        <button type="button" id="share" class="small" data-i18n="export.share"></button>
        <label class="lang"><span class="sr-only" data-i18n="app.language"></span><select id="lang"></select></label>
        <a class="source" href="https://github.com/julianroeben-a11y/binfinity" target="_blank" rel="noopener" data-i18n="app.source"></a>
      </div>
    </header>
    <main class="layout">
      <nav id="rail" class="rail" aria-label="Modell"></nav>
      <aside class="panel">
        <div class="panel-head">
          <button type="button" id="plan-back" class="link-button" hidden data-i18n="plan.back"></button>
          <h1 id="model-title" class="model-title"></h1>
          <div id="part-actions" class="part-actions" hidden>
            <button type="button" id="part-duplicate" class="small" data-i18n="plan.duplicate"></button>
            <button type="button" id="part-remove" class="small danger" data-i18n="plan.remove"></button>
          </div>
        </div>
        <form id="form" class="form" onsubmit="return false"></form>
        <div class="export">
          <dl id="estimate" class="estimate" hidden></dl>
          <div class="export-buttons">
            <button type="button" class="primary" data-export="3mf" data-i18n="export.3mf"></button>
            <button type="button" data-export="stl" data-i18n="export.stl"></button>
          </div>
          <label class="field field-bool fine"><input type="checkbox" id="fine" /> <span data-i18n="export.fine"></span></label>
          <p class="hint" data-i18n="export.hint3mf"></p>
        </div>
      </aside>
      <section class="stage">
        <div id="viewport" class="viewport"></div>
        <div id="plan" class="plan" hidden>
          <div class="plan-tools">
            <button type="button" id="add-bin" class="small" data-i18n="plan.addBin"></button>
            <button type="button" id="add-insert" class="small" data-i18n="plan.addInsert"></button>
            <span id="plan-free" class="plan-note"></span>
            <span class="plan-note" data-i18n="plan.hint"></span>
          </div>
          <div id="plan-area" class="plan-area"></div>
        </div>
        <div class="overlay overlay-top">
          <div id="plan-toggle" class="segmented" role="group" hidden>
            <button type="button" class="ghost" data-plan="plan" aria-pressed="true" data-i18n="plan.plan"></button>
            <button type="button" class="ghost" data-plan="3d" aria-pressed="false" data-i18n="plan.3d"></button>
          </div>
          <div id="view-toggle" class="segmented" role="group">
            <button type="button" class="ghost" data-view="plates" aria-pressed="true" data-i18n="view.plates"></button>
            <button type="button" class="ghost" data-view="assembled" aria-pressed="false" data-i18n="view.assembled"></button>
          </div>
          <span class="overlay-gap"></span>
          <label class="swatch ghost"><input type="color" id="color-body" value="#4f8fd6" /><span data-i18n="view.color"></span></label>
          <label class="swatch ghost"><input type="color" id="color-accent" value="#e3a33b" /><span data-i18n="view.accentColor"></span></label>
          <button type="button" id="reset-view" class="ghost" data-i18n="view.reset"></button>
        </div>
        <div class="overlay overlay-bottom">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <ul id="facts" class="facts"></ul>
          <ul id="warnings" class="warnings"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
