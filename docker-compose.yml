# Binfinity for ZimaOS / CasaOS (works with plain Docker Compose too).
# ZimaOS: App Store → "+" → "Install a customized app" → Import → paste this file.
name: binfinity

services:
  binfinity:
    image: ghcr.io/julianroeben-a11y/binfinity:latest
    container_name: binfinity
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      # Enables the update button in the app. Must match the token below.
      UPDATE_TOKEN: binfinity-update
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - binfinity
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: Web UI
            de_de: Weboberfläche

  # Optional helper for the in-app update button: pulls the newest image and
  # recreates the binfinity container, nothing else (label-enable). Remove this
  # service and UPDATE_TOKEN above if you don't want it; it needs the Docker socket.
  binfinity-updater:
    image: nickfedor/watchtower:1.23.1
    container_name: binfinity-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: binfinity-update
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    networks:
      - binfinity

# Own network so the app can reach the helper by name. Docker's default
# "bridge" network has no name resolution.
networks:
  binfinity:
    name: binfinity

x-casaos:
  architectures:
    - amd64
    - arm64
  main: binfinity
  author: julianroeben-a11y
  developer: julianroeben-a11y
  category: Utilities
  icon: https://raw.githubusercontent.com/julianroeben-a11y/binfinity/main/public/favicon.svg
  tagline:
    en_us: Gridfinity & storage box generator
    de_de: Gridfinity- & Aufbewahrungs-Generator
  description:
    en_us: Generate Gridfinity baseplates and bins and export STL or 3MF for your slicer. Everything is computed in your browser.
    de_de: Erzeugt Gridfinity-Baseplates und -Bins als STL oder 3MF für deinen Slicer. Alles wird im Browser berechnet.
  title:
    en_us: Binfinity
  index: /
  port_map: "8090"
  scheme: http
