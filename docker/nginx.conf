server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The OpenCascade engine is a ~23 MB WebAssembly file; compress it on the fly
    # (nginx already maps .wasm to application/wasm).
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # One-click update: forwarded to the Watchtower helper when it is
    # configured (see 40-binfinity-update.sh), otherwise 404.
    location = /api/update {
        include /etc/nginx/conf.d/update.inc;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
